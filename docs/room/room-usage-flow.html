<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>การใช้งานหน้าจำลองห้องครัว</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+Thai:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* skin: ITERRA (paper, ink, warm) · focal = พื้น ink ตัวอักษร paper แบบปุ่มหลักของเว็บ ไม่มีสี accent */
    :root {
      --color-paper: #faf9f7;
      --color-ink: #1c1917;
      --color-muted: #57534e;
      --font-sans: 'Inter', 'Noto Sans Thai', system-ui, sans-serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 300;
      letter-spacing: 0.02em;
      line-height: 1.3;
      margin-bottom: 1.5rem;
    }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 1000px; display: block; }
    svg text { font-family: 'Inter', 'Noto Sans Thai', system-ui, sans-serif; }
    svg .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · ITERRA /room/</p>
    <h1>การใช้งานหน้าจำลองห้องครัว</h1>

    <div class="scroll">
    <svg viewBox="0 0 1000 664" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="room-usage-flow-title room-usage-flow-desc">
      <title id="room-usage-flow-title">การใช้งานหน้าจำลองห้องครัว</title>
      <desc id="room-usage-flow-desc">ผู้ใช้เปิดหน้า /room/ ถ้าเครื่องแสดง 3 มิติได้จะเห็นฉากครัว แล้วเลือกผัง กดชิ้นส่วนเพื่อเลือกสีและวัสดุ เลือกโทนแสง และจบที่การนัดชมโชว์รูม</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57534e"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1c1917"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#faf9f7"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Arrows (drawn first, behind nodes) -->
      <!-- เปิดหน้า → ตัดสินใจ -->
      <line x1="500" y1="88" x2="500" y2="120" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- ไม่ได้ → ข้อความแจ้ง -->
      <line x1="612" y1="168" x2="720" y2="168" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- ได้ → ฉาก -->
      <line x1="500" y1="216" x2="500" y2="264" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- ฉาก → 4 การกระทำ: จุดเกาะขอบล่างแยกกัน 428 / 476 / 524 / 572 · แนวนอนคนละระดับ 348 / 364 -->
      <path d="M428 320 V340 Q428 348 420 348 H160 Q152 348 152 356 V392" fill="none" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M476 320 V356 Q476 364 468 364 H392 Q384 364 384 372 V392" fill="none" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M524 320 V356 Q524 364 532 364 H608 Q616 364 616 372 V392" fill="none" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M572 320 V340 Q572 348 580 348 H840 Q848 348 848 356 V392" fill="none" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- กดชิ้นส่วน → เลือกสีและวัสดุ -->
      <line x1="472" y1="420" x2="528" y2="420" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- เลือกสีและวัสดุ → นัดชมโชว์รูม (เส้นทางหลัก) -->
      <line x1="616" y1="448" x2="616" y2="512" stroke="#1c1917" stroke-width="1.6" marker-end="url(#arrow-accent)"/>

      <!-- Arrow labels -->
      <rect x="640" y="150" width="52" height="12" rx="2" fill="#faf9f7"/>
      <text x="666" y="159" fill="#57534e" font-size="9" text-anchor="middle">ไม่ได้</text>

      <rect x="512" y="232" width="28" height="14" rx="2" fill="#faf9f7"/>
      <text x="526" y="243" fill="#57534e" font-size="9" text-anchor="middle">ได้</text>

      <rect x="628" y="472" width="64" height="14" rx="2" fill="#faf9f7"/>
      <text x="660" y="483" fill="#1c1917" font-size="9" font-weight="500" text-anchor="middle">พอใจแล้ว</text>

      <!-- Start oval -->
      <rect x="404" y="40" width="192" height="48" rx="24" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.30)" stroke-width="1"/>
      <text x="500" y="62" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">เปิดหน้าจำลองห้องครัว</text>
      <text class="mono" x="500" y="77" fill="#57534e" font-size="9" text-anchor="middle">/room/</text>

      <!-- Diamond -->
      <polygon points="500,120 612,168 500,216 388,168" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <text x="500" y="165" fill="#1c1917" font-size="11" font-weight="600" text-anchor="middle">เครื่องแสดงภาพ</text>
      <text x="500" y="180" fill="#1c1917" font-size="11" font-weight="600" text-anchor="middle">3 มิติได้ไหม</text>

      <!-- End oval: no WebGL -->
      <rect x="720" y="140" width="216" height="56" rx="28" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.30)" stroke-width="1"/>
      <text x="828" y="165" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">ขึ้นข้อความแทนฉาก</text>
      <text x="828" y="181" fill="#57534e" font-size="9" text-anchor="middle">แผงตัวเลือกยังแสดงอยู่</text>

      <!-- Scene -->
      <rect x="380" y="264" width="240" height="56" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <text x="500" y="289" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">ฉากครัว 3 มิติ</text>
      <text x="500" y="305" fill="#57534e" font-size="9" text-anchor="middle">ลากเพื่อหมุน 180 องศา · เลื่อนหรือจีบนิ้วเพื่อซูม</text>

      <!-- A: layout -->
      <rect x="64" y="392" width="176" height="56" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <text x="152" y="417" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">เลือกผังครัว I / L / U</text>
      <text x="152" y="433" fill="#57534e" font-size="9" text-anchor="middle">กล้องเลื่อนไปหาครัวนั้น</text>

      <!-- B: click a part -->
      <rect x="296" y="392" width="176" height="56" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <text x="384" y="417" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">ชี้หรือกดชิ้นส่วนในฉาก</text>
      <text x="384" y="433" fill="#57534e" font-size="9" text-anchor="middle">แผงเลื่อนไปหมวดของชิ้นนั้น</text>

      <!-- C: materials -->
      <rect x="528" y="392" width="176" height="56" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <text x="616" y="417" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">เลือกสีและวัสดุ</text>
      <text x="616" y="433" fill="#57534e" font-size="9" text-anchor="middle">หน้าบาน ท็อป ผนัง พื้น ก๊อก</text>

      <!-- D: light -->
      <rect x="760" y="392" width="176" height="56" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <text x="848" y="417" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">เลือกโทนแสง</text>
      <text x="848" y="433" fill="#57534e" font-size="9" text-anchor="middle">กลางวัน วอร์ม คูล กลางคืน</text>

      <!-- CTA (focal) -->
      <rect x="520" y="512" width="192" height="56" rx="28" fill="#1c1917" stroke="#1c1917" stroke-width="1"/>
      <text x="616" y="537" fill="#faf9f7" font-size="12" font-weight="600" text-anchor="middle">นัดชมโชว์รูม</text>
      <text class="mono" x="616" y="553" fill="#d6d3cc" font-size="9" text-anchor="middle">/contact/</text>

      <!-- Note -->
      <text x="64" y="484" fill="#57534e" font-size="10" font-style="italic">ทุกตัวเลือกเห็นผลในฉากทันที และใช้ร่วมกันทั้ง 3 ครัว ทำซ้ำสลับกันได้ทุกขั้น</text>

      <!-- Legend -->
      <line x1="40" y1="604" x2="960" y2="604" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
      <text class="mono" x="40" y="622" fill="#57534e" font-size="8" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="636" width="24" height="12" rx="6" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.30)" stroke-width="1"/>
      <text x="72" y="646" fill="#57534e" font-size="9">เริ่ม / จบ</text>

      <rect x="168" y="636" width="24" height="12" rx="2" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <text x="200" y="646" fill="#57534e" font-size="9">สิ่งที่ผู้ใช้ทำ</text>

      <polygon points="316,642 328,636 340,642 328,648" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <text x="352" y="646" fill="#57534e" font-size="9">จุดตัดสินใจ</text>

      <rect x="464" y="636" width="24" height="12" rx="6" fill="#1c1917"/>
      <text x="496" y="646" fill="#57534e" font-size="9">เป้าหมายของหน้า</text>

      <line x1="624" y1="642" x2="652" y2="642" stroke="#1c1917" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <text x="660" y="646" fill="#57534e" font-size="9">เส้นทางหลัก</text>

      <line x1="772" y1="642" x2="800" y2="642" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="808" y="646" fill="#57534e" font-size="9">ทางเลือก</text>
    </svg>
    </div>
  </div>
</body>
</html>
