# ตัวอย่าง config ของเว็บใน reverse proxy (ตัวที่มากับ 1Panel ใช้รูปแบบ nginx)
# ตำแหน่งที่วางใน 1Panel ยังไม่ได้ตรวจ · ใส่ใน server block ของโดเมนที่เปิด HTTPS แล้ว

# PDF แคตตาล็อกรับได้ 30 MB
client_max_body_size 31m;

# ส่งไฟล์อัปโหลดจากโฟลเดอร์ตรง ไม่ผ่าน Node · nginx รองรับ Range เอง วิดีโอบน iPhone ต้องใช้
# mime.types ของ nginx มี image/webp และ video/webm อยู่แล้ว
location /uploads/ {
    alias /srv/iterra/uploads/;
    add_header X-Content-Type-Options nosniff;
    expires 1y;
    access_log off;
}

# วิดีโอ hero อัปโหลดได้ไม่เกิน 100 MB · ขยายเพดานเฉพาะ route นี้
location /api/hero-video/ {
    client_max_body_size 101m;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    # lib/admin.ts ใช้ IP นี้นับการเดารหัสและจำกัดการส่งฟอร์ม
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ถ้าเปิดโหมด proxy ของ Cloudflare (เมฆสีส้ม) ต้องเพิ่ม 2 บรรทัดนี้ และใส่ช่วง IP ของ Cloudflare ให้ครบ
# set_real_ip_from <ช่วง IP จาก https://www.cloudflare.com/ips/>;
# real_ip_header CF-Connecting-IP;
